name: Desktop release

"on":
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to publish (leave empty to build only)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
            bundles: nsis
            assets: src-tauri/target/release/bundle/nsis/*.exe
          - platform: linux-x64
            runner: ubuntu-22.04
            bundles: deb,appimage
            assets: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          - platform: macos-arm64
            runner: macos-15
            bundles: dmg
            assets: src-tauri/target/release/bundle/dmg/*.dmg
          - platform: macos-x64
            runner: macos-15-intel
            bundles: dmg
            assets: src-tauri/target/release/bundle/dmg/*.dmg

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG != '' && format('refs/tags/{0}', env.RELEASE_TAG) || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install stable Rust
        run: rustup update stable && rustup default stable
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Confirm release version
        if: env.RELEASE_TAG != ''
        shell: bash
        run: GITHUB_REF_NAME="$RELEASE_TAG" node scripts/check-release-version.cjs
      - run: npm ci
      - name: Build installer
        env:
          BUNDLES: ${{ matrix.bundles }}
        shell: bash
        run: npm run release:build -- --bundles "$BUNDLES" -- --locked
      - uses: actions/upload-artifact@v7
        with:
          name: site-downloader-${{ matrix.platform }}
          path: ${{ matrix.assets }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: github.ref_type == 'tag' || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: site-downloader-*
          path: release-assets
      - name: Publish all installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -d '' files < <(find release-assets -type f \( -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' \) -print0)
          if [ "${#files[@]}" -ne 5 ]; then
            echo "Expected five desktop installers, got ${#files[@]}."
            exit 1
          fi
          gh release create "$RELEASE_TAG" "${files[@]}" --verify-tag --title "Site Downloader $RELEASE_TAG" --generate-notes
