name: Desktop release

"on":
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to publish (leave empty to build only)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || '' }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
            bundles: nsis
            assets: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/nsis/*.exe.sig
          - platform: linux-x64
            runner: ubuntu-22.04
            bundles: deb,appimage
            assets: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/deb/*.deb.sig
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/appimage/*.AppImage.sig
          - platform: macos-arm64
            runner: macos-15
            bundles: app,dmg
            assets: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app.tar.gz
              src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          - platform: macos-x64
            runner: macos-15-intel
            bundles: app,dmg
            assets: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app.tar.gz
              src-tauri/target/release/bundle/macos/*.app.tar.gz.sig

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG != '' && format('refs/tags/{0}', env.RELEASE_TAG) || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install stable Rust
        run: rustup update stable && rustup default stable
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Confirm release version
        if: env.RELEASE_TAG != ''
        shell: bash
        run: GITHUB_REF_NAME="$RELEASE_TAG" node scripts/check-release-version.cjs
      - run: npm ci
      - name: Build installer
        if: env.RELEASE_TAG == ''
        env:
          BUNDLES: ${{ matrix.bundles }}
        shell: bash
        run: npm run release:build -- --bundles "$BUNDLES" -- --locked
      - name: Build installers and sign updater bundles
        if: env.RELEASE_TAG != ''
        env:
          BUNDLES: ${{ matrix.bundles }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          node scripts/updater-release.cjs config > "$RUNNER_TEMP/tauri-updater.json"
          npm run release:build -- --config "$RUNNER_TEMP/tauri-updater.json" --bundles "$BUNDLES" -- --locked
      - name: Remove duplicate volume icon from macOS installers
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for image in src-tauri/target/release/bundle/dmg/*.dmg; do
            bash scripts/clean-macos-dmg.sh "$image"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: site-downloader-${{ matrix.platform }}
          path: ${{ matrix.assets }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8
        with:
          pattern: site-downloader-*
          path: release-assets
      - name: Publish all installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          node scripts/updater-release.cjs stage release-assets publish-assets "$RELEASE_TAG"
          labeled_files=()
          for file in publish-assets/*; do
            case "$file" in
              *_aarch64.dmg) label='macOS — Apple Silicon (чипы M) · .dmg' ;;
              *_x64.dmg) label='macOS — Intel · .dmg' ;;
              *.exe) label='Windows — 64-битная (x64) · .exe' ;;
              *.deb) label='Ubuntu / Debian — 64-битные (x64) · .deb' ;;
              *.AppImage) label='Linux — 64-битный (x64) · .AppImage' ;;
              *) labeled_files+=("$file"); continue ;;
            esac
            labeled_files+=("$file#$label")
          done
          cat > release-notes.md <<'EOF'
          ## Какой файл скачать

          - **Mac с чипом M1, M2, M3, M4 или новее** — `Apple Silicon` (.dmg).
          - **Mac с процессором Intel** — `Intel` (.dmg).
          - **Windows x64** — установщик (.exe).
          - **Linux x64** — пакет для Ubuntu и Debian (.deb) или AppImage.

          Тип Mac указан в меню  → «Об этом Mac». При первом захвате приложение скачает Chromium, если его ещё нет.

          Для будущих версий приложение проверяет обновления при запуске. Кнопка **Обновления** показывает доступную версию и позволяет запустить установку.
          EOF
          gh release create "$RELEASE_TAG" "${labeled_files[@]}" --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md --generate-notes
